name: Android Build Release

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE }}" | base64 -d > release.jks || echo "${{ secrets.KEYSTORE }}" | base64 --decode > release.jks
        cp release.jks app/release.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release (AAB & APK)
      run: |
        ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      env:
        RELEASE_STORE_FILE: release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Print Build Error Log
      if: failure()
      run: |
        ERR_MSG=$(tail -n 35 build.log | tr '\r\n' '  ')
        echo "::error title=Gradle Build Failure::$ERR_MSG"

    - name: Verify Signed APK
      run: |
        echo "Verifying build outputs..."
        find app/build/outputs/ -type f || true
        ls -la app/build/outputs/bundle/release/ || true

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/**/*.apk

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-log
        path: build.log
